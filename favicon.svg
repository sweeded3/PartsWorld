:root {
  --primary: #ff3e00;
  --primary-dark: #cc3300;
  --dark: #171717;
  --text: #303030;
  --muted: #686868;
  --light: #f6f6f6;
  --line: #e8e8e8;
  --white: #ffffff;
  --shadow: 0 20px 45px rgba(0, 0, 0, 0.10);
  --radius-lg: 22px;
  --radius-md: 14px;
  --transition: all 0.25s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 92px; }
body {
  min-width: 320px;
  font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.6;
  color: var(--text);
  background: var(--white);
  overflow-x: hidden;
}
body.menu-open { overflow: hidden; }
a { color: inherit; }
button, input, textarea { font: inherit; }
img, iframe { max-width: 100%; }

.container { width: min(100% - 32px, 1180px); margin-inline: auto; }
.skip-link {
  position: fixed; top: 12px; left: 12px; z-index: 2000;
  transform: translateY(-150%); padding: 10px 14px; border-radius: 10px;
  color: var(--white); background: var(--dark); text-decoration: none;
}
.skip-link:focus { transform: translateY(0); }

.site-header {
  position: fixed; inset: 0 0 auto; z-index: 1000;
  background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px);
  box-shadow: 0 2px 18px rgba(0, 0, 0, 0.08);
}
.header-inner { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
.logo-mark {
  width: 46px; height: 46px; display: inline-grid; place-items: center; flex: 0 0 auto;
  border-radius: 14px; color: var(--white); background: var(--primary); font-size: 22px;
  box-shadow: 0 10px 22px rgba(255, 62, 0, 0.24);
}
.logo-text { display: flex; flex-direction: column; line-height: 1.1; }
.logo-main { color: var(--dark); font-size: clamp(20px, 2.1vw, 26px); font-weight: 900; }
.logo-sub { margin-top: 4px; color: var(--muted); font-size: clamp(10px, 1.2vw, 13px); }

.nav-list { display: flex; align-items: center; gap: 26px; list-style: none; }
.nav-link, .footer-links a, .site-nav a { color: var(--text); font-weight: 800; text-decoration: none; transition: var(--transition); }
.nav-link:hover, .nav-link:focus-visible, .footer-links a:hover, .footer-links a:focus-visible, .site-nav a:hover, .site-nav a:focus-visible { color: var(--primary); }
.menu-toggle {
  display: none; width: 46px; height: 46px; place-items: center; border: 1px solid var(--line);
  border-radius: 14px; color: var(--dark); background: var(--white); cursor: pointer; font-size: 22px;
}

.hero {
  min-height: 650px; padding: 136px 0 78px; display: grid; place-items: center; text-align: center; color: var(--white);
  background: linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.55)), url("https://images.unsplash.com/photo-1493238792000-8113da705763?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80") center/cover no-repeat;
}
.hero-content { max-width: 920px; }
.hero-badge {
  width: fit-content; margin: 0 auto 18px; display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
  background: rgba(255,255,255,.12); font-weight: 800;
}
.hero h1 { margin-bottom: 20px; font-size: clamp(34px, 6vw, 64px); line-height: 1.05; text-wrap: balance; }
.hero p { max-width: 740px; margin: 0 auto 30px; color: rgba(255,255,255,.92); font-size: clamp(17px, 2vw, 22px); }
.btn-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
.btn {
  min-height: 50px; min-width: 210px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 12px 26px; border: 2px solid var(--primary); border-radius: 999px;
  color: var(--white); background: var(--primary); font-weight: 900; text-decoration: none; cursor: pointer; transition: var(--transition);
}
.btn:hover, .btn:focus-visible { background: var(--primary-dark); border-color: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 12px 24px rgba(255,62,0,.25); }
.btn-outline { background: transparent; border-color: var(--white); }
.btn-outline:hover, .btn-outline:focus-visible { background: var(--white); border-color: var(--white); color: var(--primary); }
.btn-dark { background: var(--dark); border-color: var(--dark); }

.brands-marquee { overflow: hidden; padding: 12px 0; color: var(--white); background: var(--primary); }
.brands-track { display: inline-block; min-width: max-content; white-space: nowrap; animation: marquee 36s linear infinite; }
.brand-item { position: relative; display: inline-flex; margin: 0 28px; font-size: clamp(12px, 1.2vw, 16px); font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.brand-item::after { content: "•"; position: absolute; right: -34px; color: rgba(255,255,255,.4); }
@keyframes marquee { to { transform: translateX(-50%); } }

.section { padding: clamp(70px, 8vw, 108px) 0; }
.section-alt { background: var(--light); }
.section-head { max-width: 790px; margin: 0 auto 48px; text-align: center; }
.eyebrow { display: inline-block; margin-bottom: 12px; color: var(--primary); font-size: 13px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
.section-head h2, .page-title h1 { margin-bottom: 14px; color: var(--dark); font-size: clamp(30px, 4vw, 46px); line-height: 1.12; text-wrap: balance; }
.section-head p, .page-title p { color: var(--muted); font-size: 17px; }

.about-grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 28px; align-items: stretch; }
.about-card, .feature-card, .contact-form, .map-card, .content-card {
  border: 1px solid rgba(0,0,0,.04); border-radius: var(--radius-lg); background: var(--white); box-shadow: var(--shadow);
}
.about-card { padding: 34px; }
.about-card h3 { margin-bottom: 16px; color: var(--dark); font-size: clamp(24px, 3vw, 34px); line-height: 1.16; }
.about-card p + p { margin-top: 14px; }
.features { display: grid; gap: 16px; }
.feature-card { display: grid; grid-template-columns: 58px 1fr; gap: 16px; padding: 22px; box-shadow: 0 14px 32px rgba(0,0,0,.08); }
.feature-icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; color: var(--primary); background: rgba(255,62,0,.10); font-size: 22px; }
.feature-card h3 { margin-bottom: 6px; color: var(--dark); }
.feature-card p { color: var(--muted); }

.catalog-accordion { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
.accordion-item { overflow: hidden; border-radius: var(--radius-lg); background: var(--white); box-shadow: 0 14px 34px rgba(0,0,0,.09); }
.accordion-header { width: 100%; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 20px 26px; border: 0; color: var(--dark); background: var(--white); font-size: clamp(17px, 2vw, 21px); font-weight: 900; text-align: left; cursor: pointer; }
.accordion-header:hover, .accordion-header:focus-visible { background: #f2f2f2; }
.accordion-icon { transition: transform .25s ease; }
.accordion-header[aria-expanded="true"] .accordion-icon { transform: rotate(180deg); }
.accordion-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
.accordion-content.is-open { grid-template-rows: 1fr; }
.accordion-content-inner { min-height: 0; overflow: hidden; border-top: 1px solid var(--line); }
.parts-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; list-style: none; padding: 12px 26px 18px; }
.parts-list li { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f0f0f0; }
.parts-list i { width: 22px; color: var(--primary); text-align: center; }

.promo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.promo-card { position: relative; min-height: 280px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 28px; border-radius: var(--radius-lg); color: var(--white); background: linear-gradient(135deg, var(--primary), #ff7a00); box-shadow: var(--shadow); transition: var(--transition); }
.promo-card:nth-child(2) { background: linear-gradient(135deg, #0077b6, #00b4d8); }
.promo-card:nth-child(3) { background: linear-gradient(135deg, #2a2a2a, #595959); }
.promo-card:hover { transform: translateY(-4px); }
.promo-badge { position: absolute; top: 20px; right: 20px; z-index: 1; padding: 6px 14px; border-radius: 999px; color: var(--primary); background: var(--white); font-size: 13px; font-weight: 900; }
.promo-icon { position: absolute; top: 24px; left: 24px; color: rgba(255,255,255,.16); font-size: 64px; }
.promo-card h3 { margin-bottom: 10px; font-size: 25px; }
.promo-card p { margin-bottom: 10px; color: rgba(255,255,255,.92); }
.promo-card small { color: rgba(255,255,255,.82); }

.contacts-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, .92fr); gap: 28px; align-items: start; }
.map-card { overflow: hidden; }
.map-wrap { height: 390px; background: var(--line); }
.map-wrap iframe { width: 100%; height: 100%; display: block; border: 0; }
.map-actions { padding: 20px 24px 0; }
.contact-info { display: grid; gap: 16px; padding: 24px; }
.contact-item { display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
.contact-item i { color: var(--primary); font-size: 20px; margin-top: 2px; }
.contact-item strong { display: block; color: var(--dark); }
.contact-item a, .form-note a, .content-card a:not(.btn) { color: var(--primary); font-weight: 800; text-decoration: none; }
.contact-item a:hover, .form-note a:hover, .content-card a:hover { text-decoration: underline; }
.contact-form { padding: 30px; }
.contact-form h3 { margin-bottom: 8px; color: var(--dark); font-size: 28px; }
.form-note, .file-hint { color: var(--muted); font-size: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 22px 0 18px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label, .file-box label { display: block; margin-bottom: 8px; color: var(--dark); font-weight: 900; }
.form-group input, .form-group textarea, .file-box input { width: 100%; padding: 13px 15px; border: 1px solid #d5d5d5; border-radius: 12px; background: var(--white); color: var(--text); }
.form-group textarea { min-height: 132px; resize: vertical; }
.form-group input:focus, .form-group textarea:focus, .file-box input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(255,62,0,.12); }
.file-box { margin-bottom: 18px; padding: 16px; border: 1px dashed #cfcfcf; border-radius: var(--radius-md); background: #fafafa; }
.file-hint { margin-top: 8px; }
.form-status { min-height: 24px; margin: 12px 0 8px; color: var(--primary-dark); font-weight: 800; }
.example-table { margin-top: 22px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 360px; background: var(--white); }
caption { margin-bottom: 10px; color: var(--muted); font-weight: 800; text-align: left; }
th, td { padding: 10px 12px; border: 1px solid var(--line); text-align: left; }
th { color: var(--dark); background: #f1f1f1; }

.site-footer { padding: 64px 0 28px; color: var(--white); background: var(--dark); }
.footer-grid { display: grid; grid-template-columns: 1.2fr .8fr .8fr; gap: 34px; margin-bottom: 34px; }
.footer-title { margin-bottom: 14px; color: var(--white); font-size: 23px; }
.footer-text, .footer-bottom { color: rgba(255,255,255,.68); }
.social-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.social-link { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 50%; color: var(--white); background: rgba(255,255,255,.10); text-decoration: none; transition: var(--transition); }
.social-link:hover, .social-link:focus-visible { background: var(--primary); transform: translateY(-2px); }
.footer-links { list-style: none; display: grid; gap: 10px; }
.footer-links a { color: rgba(255,255,255,.72); }
.footer-bottom { display: flex; justify-content: space-between; gap: 16px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.12); font-size: 14px; }

.page-main { min-height: 100vh; background: var(--light); }
.page-title { padding: 130px 0 44px; text-align: center; }
.content-card { width: min(100% - 32px, 920px); margin: 0 auto 80px; padding: 34px; }
.content-card h2 { margin: 24px 0 8px; color: var(--dark); }
.content-card p + p { margin-top: 12px; }

@media (max-width: 980px) {
  .about-grid, .contacts-grid, .footer-grid { grid-template-columns: 1fr; }
  .promo-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  html { scroll-padding-top: 78px; }
  .header-inner { min-height: 70px; }
  .menu-toggle { display: grid; }
  .site-nav { position: fixed; top: 70px; left: 16px; right: 16px; z-index: 1001; opacity: 0; visibility: hidden; transform: translateY(-12px); transition: var(--transition); }
  .site-nav.is-open { opacity: 1; visibility: visible; transform: translateY(0); }
  .nav-list { display: grid; gap: 0; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--white); box-shadow: var(--shadow); }
  .nav-link { display: block; padding: 13px 10px; text-align: center; }
  .hero { min-height: 560px; padding-top: 110px; }
  .btn, .btn-row { width: 100%; }
  .parts-list, .form-grid { grid-template-columns: 1fr; }
  .map-wrap { height: 330px; }
  .footer-bottom { flex-direction: column; align-items: center; text-align: center; }
}
@media (max-width: 520px) {
  .container { width: min(100% - 24px, 1180px); }
  .logo-mark { width: 40px; height: 40px; border-radius: 12px; }
  .logo-sub { max-width: 190px; }
  .hero { min-height: 520px; }
  .brand-item { margin: 0 18px; }
  .about-card, .contact-form, .content-card { padding: 24px; }
  .feature-card { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
